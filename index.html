<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>電話關懷紀錄</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9E%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--card:#f1f3f6;--pri:#0b57d0;--onpri:#fff;--bd:#8a93a3;--ok:#0a6b2d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--fg:#f3f3f3;--card:#1e2226;--pri:#8ab4ff;--onpri:#0b1020;--bd:#6b7482;--ok:#7fdc9a}}
:root[data-theme="dark"]{--bg:#101214;--fg:#f3f3f3;--card:#1e2226;--pri:#8ab4ff;--onpri:#0b1020;--bd:#6b7482;--ok:#7fdc9a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:26px;margin:8px 0}h2{font-size:21px;margin:18px 0 6px}
h1:focus{outline:none}
button,input,textarea{font:inherit;color:inherit}
button{display:block;width:100%;min-height:60px;margin:8px 0;padding:10px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);text-align:left}
button.p{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700;text-align:center}
input[type=text],input[type=search],textarea{width:100%;min-height:56px;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--bg)}
textarea{min-height:140px}
label{display:block;margin:12px 0 4px;font-weight:700}
.chk{display:flex;gap:12px;align-items:center;min-height:56px;padding:6px 10px;border:2px solid var(--bd);border-radius:12px;margin:6px 0;font-weight:400}
.chk input{width:30px;height:30px;flex:none}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.hl{border:3px solid var(--pri)}
.m{font-size:17px;opacity:.85}.ok{color:var(--ok);font-weight:700}
.row{display:flex;gap:8px}.row button{text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<div id="live" aria-live="polite" role="status" style="position:absolute;left:-9999px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var P=["關心照顧者身心狀況","情緒支持與陪伴","邀請參加據點活動","提供據點服務資訊","了解照顧需求","提醒或確認服務事項","資源需求確認"];
var db={vol:"張家萍",cases:[]},view={n:"home"},q="",box="";
function save(){try{localStorage.setItem("careDB",JSON.stringify(db))}catch(e){}}
function load(){try{var s=localStorage.getItem("careDB");if(s){db=JSON.parse(s);return}}catch(e){}
 db.cases=[];save()}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function say(t){document.getElementById("live").textContent=t}
function roc(){var n=new Date(),z=function(x){return(x<10?"0":"")+x};return[n.getFullYear()-1911,z(n.getMonth()+1),z(n.getDate())].join(".")}
function now(){var n=new Date(),m=n.getMinutes();return n.getHours()+":"+(m<10?"0":"")+m}
function go(v){view=v;render();var h=document.querySelector("h1");if(h){h.setAttribute("tabindex","-1");h.focus()}window.scrollTo(0,0)}
function find(id){return db.cases.filter(function(c){return c.id===id})[0]}
function last(c){return c.recs.length?c.recs[c.recs.length-1]:null}
function render(){var a=document.getElementById("app"),h="";
 if(view.n==="home"){
  var l=db.cases.filter(function(c){return !q||c.name.indexOf(q)>-1||c.id.indexOf(q)>-1});
  h+='<h1>電話關懷紀錄</h1><label for="q">輸入姓名或序號搜尋</label><input id="q" type="search" value="'+esc(q)+'" autocomplete="off">';
  h+='<h2>個案（'+l.length+'位）</h2>';
  l.forEach(function(c){var r=last(c);h+='<button data-case="'+esc(c.id)+'">'+esc(c.id)+' '+esc(c.name)+'<div class="m">'+(r?"上次 "+esc(r.d)+(r.ok?" 已接通":" 未接"):"尚無紀錄")+'</div></button>'});
  if(!l.length)h+='<p>找不到，請在下方新增。</p>';
  h+='<h2>新增個案</h2><label for="ni">序號</label><input id="ni" type="text" inputmode="numeric"><label for="nn">姓名</label><input id="nn" type="text"><button class="p" id="add">新增個案</button>';
  h+='<button class="p" id="dla">下載全部個案 Word 紀錄表</button><button id="bk">備份與還原</button>';
 }else if(view.n==="case"){
  var c=find(view.id),R=c.recs.slice().reverse(),k=R.filter(function(r){return r.ok&&r.s})[0];
  h+='<button id="back">← 回到名單</button><h1>'+esc(c.id)+' '+esc(c.name)+'</h1><button class="p" id="new">開始新的通話紀錄</button>';
  h+='<h2>通話前請先聽這段</h2>';
  h+=k?'<div class="card hl"><b>最近一次有聊到（'+esc(k.d)+'）：</b><br>'+esc(k.s)+(k.n?'<br>備註：'+esc(k.n):'')+'</div>':'<div class="card hl">目前還沒有聊過的內容。已撥打 '+c.recs.length+' 次。</div>';
  h+='<p class="m">共 '+c.recs.length+' 次紀錄，其中接通 '+c.recs.filter(function(r){return r.ok}).length+' 次。</p><h2>全部紀錄（新到舊）</h2>';
  R.forEach(function(r){h+='<div class="card"><b>'+esc(r.d)+' '+esc(r.t)+'</b> <span class="'+(r.ok?'ok':'')+'">'+(r.ok?"接通":"未接")+'</span><br>目的：'+(r.p.map(function(i){return P[i]}).join("、")||"無")+(r.s?'<br>摘要：'+esc(r.s):'')+(r.n?'<br>備註：'+esc(r.n):'')+'<div class="m">志工：'+esc(r.v)+'</div></div>'});
  h+='<button class="p" id="dl1">下載此個案 Word 紀錄表</button><button id="cp">複製此個案紀錄（貼到紀錄表）</button>';
  if(box)h+='<label for="bx">全選後拷貝</label><textarea id="bx">'+esc(box)+'</textarea>';
 }else if(view.n==="form"){
  var c=find(view.id);
  h+='<h1>新紀錄：'+esc(c.name)+'</h1><label for="d">日期</label><input id="d" type="text" value="'+roc()+'"><label for="t">時間</label><input id="t" type="text" value="'+now()+'">';
  h+='<h2>是否接通</h2><div class="row"><button class="p" id="y" aria-pressed="true">接通 ✓</button><button id="no" aria-pressed="false">未接</button></div>';
  h+='<h2>聯繫目的（可複選）</h2>';P.forEach(function(x,i){h+='<label class="chk"><input type="checkbox" class="pp" value="'+i+'">'+x+'</label>'});
  h+='<label for="s">服務摘要（可用語音輸入口述）</label><textarea id="s"></textarea><label for="n">備註</label><textarea id="n" style="min-height:90px"></textarea><label for="v">服務志工</label><input id="v" type="text" value="'+esc(db.vol)+'">';
  h+='<button class="p" id="sv">儲存紀錄</button><button id="cc">取消</button>';
 }else{
  h+='<button id="back">← 回到名單</button><h1>備份與還原</h1><p>複製下面文字存起來即可備份；要還原時貼上並按還原。</p><textarea id="bx">'+esc(JSON.stringify(db))+'</textarea><button class="p" id="dlb">下載備份檔</button><button id="rs">還原貼上的內容</button>';
 }
 a.innerHTML=h}

function saveFile(n,bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}
function pa(t,b,c){return '<w:p><w:pPr>'+(c?'<w:jc w:val="center"/>':'')+'</w:pPr><w:r>'+(b?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+esc(t)+'</w:t></w:r></w:p>'}
function tc(L,w,b){return '<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/></w:tcPr><w:p>'+L.map(function(t,i){return '<w:r>'+(b?'<w:rPr><w:b/></w:rPr>':'')+(i?'<w:br/>':'')+'<w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>'}).join('')+'</w:p></w:tc>'}
var W=[1100,800,1300,4400,3800,2300,1698];
function tbl(c){var H=["日期","時間","是否接通","本次電話聯繫目的","服務摘要","備註","服務志工"],b='<w:tbl><w:tblPr><w:tblW w:w="15398" w:type="dxa"/><w:tblBorders>'+["top","left","bottom","right","insideH","insideV"].map(function(x){return '<w:'+x+' w:val="single" w:sz="4" w:color="000000"/>'}).join('')+'</w:tblBorders></w:tblPr><w:tr>'+H.map(function(h,i){return tc([h],W[i],1)}).join('')+'</w:tr>';
 c.recs.forEach(function(r){var pl=P.map(function(x,i){return (r.p.indexOf(i)>-1?"■ ":"□ ")+x}).concat("□ 其他：____________");
  b+='<w:tr>'+[[r.d],[r.t],[(r.ok?"■ 接通 □ 未接":"□ 接通 ■ 未接")],pl,[r.s],[r.n],[r.v]].map(function(L,i){return tc(L,W[i])}).join('')+'</w:tr>'});
 return pa("社團法人中華民國紅心字會",1,1)+pa("臺北市文山區家庭照顧者支持共融據點",1,1)+pa("電話訪視/關懷紀錄表",1,1)+pa("個案姓名："+c.name,1)+b+'</w:tbl>'}
async function dl(cs){try{
 cs=cs.filter(function(c){return c.recs.length});if(!cs.length){say("還沒有紀錄可下載");return}
 var body=cs.map(tbl).join('<w:p><w:r><w:br w:type="page"/></w:r></w:p>'),z=new JSZip(),N='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
 z.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document '+N+'><w:body>'+body+'<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"/></w:sectPr></w:body></w:document>');
 var bl=await z.generateAsync({type:"blob"});saveFile("電話關懷訪視個案紀錄表_"+roc()+".docx",bl);say("已產生檔案")}catch(e){say("下載失敗")}}
var ok=1;
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.case){box="";go({n:"case",id:b.dataset.case})}
 else if(b.id==="back"){q="";box="";go({n:"home"})}
 else if(b.id==="new"){ok=1;go({n:"form",id:view.id})}
 else if(b.id==="cc")go({n:"case",id:view.id});
 else if(b.id==="dl1")dl([find(view.id)]);
 else if(b.id==="dla")dl(db.cases);
 else if(b.id==="bk")go({n:"bk"});
 else if(b.id==="add"){var i=document.getElementById("ni").value.trim(),n=document.getElementById("nn").value.trim();if(!n){say("請輸入姓名");return}db.cases.push({id:i||String(db.cases.length+1),name:n,recs:[]});save();q="";say("已新增 "+n);go({n:"home"})}
 else if(b.id==="y"||b.id==="no"){ok=b.id==="y"?1:0;var y=document.getElementById("y"),no=document.getElementById("no");y.className=ok?"p":"";no.className=ok?"":"p";y.textContent=ok?"接通 ✓":"接通";no.textContent=ok?"未接":"未接 ✓";y.setAttribute("aria-pressed",ok?"true":"false");no.setAttribute("aria-pressed",ok?"false":"true");say(ok?"已選接通":"已選未接")}
 else if(b.id==="sv"){var c=find(view.id),p=[].slice.call(document.querySelectorAll(".pp:checked")).map(function(x){return+x.value}),g=function(i){return document.getElementById(i).value.trim()};
  db.vol=g("v")||db.vol;c.recs.push({d:g("d"),t:g("t"),ok:ok,p:p,s:g("s"),n:g("n"),v:db.vol});save();say("已儲存");go({n:"case",id:view.id})}
 else if(b.id==="cp"){var c=find(view.id);box="個案姓名："+c.name+"\n"+c.recs.map(function(r){return[r.d,r.t,r.ok?"接通":"未接","目的："+r.p.map(function(i){return P[i]}).join("、"),"摘要："+r.s,"備註："+r.n,"志工："+r.v].join(" | ")}).join("\n");render();var t=document.getElementById("bx");try{t.select();navigator.clipboard.writeText(box);say("已複製")}catch(x){say("請手動拷貝下方文字")}}
 else if(b.id==="dlb"){saveFile("備份_"+roc()+".json",new Blob([JSON.stringify(db)],{type:"application/json"}));say("已產生備份檔")}
 else if(b.id==="rs"){try{var o=JSON.parse(document.getElementById("bx").value);if(o&&o.cases){db=o;save();say("已還原");go({n:"home"})}}catch(x){say("內容格式不對")}}
});
function sq(t){q=t.value;var p=t.selectionStart;render();var i=document.getElementById("q");i.focus();i.setSelectionRange(p,p)}
document.addEventListener("input",function(e){if(e.target.id==="q"&&!e.isComposing)sq(e.target)});
document.addEventListener("compositionend",function(e){if(e.target.id==="q")sq(e.target)});
load();render();
</script>
</body>
</html>
